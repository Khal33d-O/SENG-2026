<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W2.10 Local event view</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="dist/events-view.js"></script>
</head>
<body>
  <main>
    <h1>Local event view</h1>
    <p>Rows live only in this serve.py process's memory: save the text you need before Ctrl+C.
      This view is not Grafana and establishes no BP route.</p>
    <p><label for="run-filter">Run ID</label> <input id="run-filter" size="28">
      <button type="button" id="refresh">Refresh</button></p>
    <p id="view-status" role="status">Loading…</p>
    <table>
      <thead><tr><th>Row</th><th>Run ID</th><th>Sequence</th><th>Action</th><th>Result</th><th>Before</th><th>After</th><th>Plan</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</body>
</html>
